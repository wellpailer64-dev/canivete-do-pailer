<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KANIVETE — Instalação</title>
<!-- Tela da 1ª instalação (first_run.py abre numa janela do pywebview). Banners = o mesmo carrossel da Home (home-banners.js). -->
<link rel="stylesheet" href="css/app.css">
<style>
  html, body { height: 100%; }
  body.instalador { margin: 0; overflow: hidden; background: #0b0a0c; color: #f2efe9; font-family: var(--font-ui, "Segoe UI", sans-serif);
      display: grid; grid-template-rows: auto 1fr auto; user-select: none; }
  .in-video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .2; filter: saturate(.4); z-index: -2; pointer-events: none; }
  .in-luz { position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background: radial-gradient(60% 55% at 85% 115%, rgba(212,129,74,.28), transparent 70%), radial-gradient(45% 50% at 0% -10%, rgba(212,129,74,.16), transparent 70%),
                  linear-gradient(180deg, rgba(11,10,12,.2), rgba(11,10,12,.85)); }
  .in-topo { display: flex; align-items: center; gap: 14px; padding: 26px clamp(20px, 4vw, 56px) 0; }
  .in-topo img { width: 46px; height: 46px; border-radius: 10px; box-shadow: 0 0 0 1px rgba(255,255,255,.12), 0 8px 24px rgba(0,0,0,.45); }
  .in-topo .wordmark { height: 22px; color: #f2efe9; }
  .in-topo small { display: block; margin-top: 6px; color: rgba(242,239,233,.55); font-size: 12.5px; letter-spacing: .02em; }
  .in-meio { display: flex; flex-direction: column; justify-content: center; padding: 18px clamp(20px, 4vw, 56px); min-height: 0; }
  .in-meio .home-banners { width: min(100%, 1240px); margin: 0 auto; }
  .in-meio .hb-cta { display: none !important; }
  .in-meio .hb-slide, .in-meio .hb-chip { cursor: default; }
  .in-rodape { padding: 0 clamp(20px, 4vw, 56px) 26px; }
  .in-caixa { width: min(100%, 1240px); margin: 0 auto; padding: 18px 22px 16px; border-radius: 16px; background: rgba(20,18,21,.82);
      box-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 18px 50px rgba(0,0,0,.5); }
  .in-linha { display: flex; align-items: baseline; gap: 16px; }
  .in-pct { font: 800 34px/1 var(--font-ui, "Segoe UI"); color: var(--primary, #D4814A); font-variant-numeric: tabular-nums; min-width: 92px; }
  .in-txt { flex: 1; min-width: 0; }
  .in-item { color: #f2efe9; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .in-conta { margin-top: 3px; color: rgba(242,239,233,.5); font-size: 12px; font-variant-numeric: tabular-nums; }
  .in-trilho { position: relative; height: 12px; margin-top: 14px; border-radius: 99px; background: rgba(255,255,255,.07); overflow: hidden; }
  .in-barra { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 99px; transition: width .45s cubic-bezier(.2,.8,.2,1);
      background: linear-gradient(90deg, #a85a2c, #D4814A 55%, #ffb27a); box-shadow: 0 0 18px rgba(212,129,74,.55); }
  .in-barra::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
      background-size: 40% 100%; background-repeat: no-repeat; animation: in-brilho 1.8s linear infinite; }
  @keyframes in-brilho { from { background-position: -40% 0; } to { background-position: 140% 0; } }
  .in-sub { height: 3px; margin-top: 6px; border-radius: 99px; background: rgba(255,255,255,.05); overflow: hidden; }
  .in-sub i { display: block; height: 100%; width: 0; background: rgba(212,129,74,.55); transition: width .3s; }
  body.girando .in-sub i { width: 30% !important; animation: in-vai 1.2s ease-in-out infinite alternate; }
  @keyframes in-vai { from { transform: translateX(-10%); } to { transform: translateX(240%); } }
  .in-baixo { display: flex; align-items: center; gap: 12px; margin-top: 12px; color: rgba(242,239,233,.45); font-size: 12px; }
  .in-baixo p { flex: 1; margin: 0; }
  .in-som { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 99px;
      background: rgba(255,255,255,.04); color: #f2efe9; font: 600 12px var(--font-ui, "Segoe UI"); cursor: pointer; }
  .in-som:hover { border-color: var(--primary, #D4814A); }
  .in-som svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .in-som .onda { transition: opacity .2s; } .in-som.off .onda { opacity: 0; } .in-som .x { opacity: 0; } .in-som.off .x { opacity: 1; }
  .in-som:not(.off) .onda { animation: in-pulsa 1.4s ease-in-out infinite; }
  @keyframes in-pulsa { 50% { opacity: .35; } }
  .in-som[hidden], .in-credito[hidden] { display: none; }
  .in-credito { color: rgba(242,239,233,.35); font-size: 11px; }
  body.fim .in-barra { background: linear-gradient(90deg, #D4814A, #ffb27a); }
  body.fim .in-pct { color: #ffb27a; }
  @media (max-height: 700px) { .in-meio .hb-trilho { display: none; } }
</style>
</head>
