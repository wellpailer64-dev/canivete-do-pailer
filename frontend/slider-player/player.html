<script>
'use strict';
const D = JSON.parse(document.getElementById('dados').textContent);
const W = D.largura || 1920, H = D.altura || 1080;
const $ = id => document.getElementById(id);
const P = { lista: [], i: 0, passo: 0, passos: [], ini: 0, num: '', oc: new Set(), fim: false, ocupado: false, wake: null };
const toque = matchMedia('(pointer: coarse)').matches;

// ── mídias: base64 dentro do arquivo → Blob na hora de usar (vídeo toca de blob em todo navegador, inclusive iPhone) ──
const URLS = {};
// decodifica em pedaços (sem a cópia inteira de um vídeo grande) e solta o texto depois: no celular a mídia fica uma vez só
// na memória. Cada mídia vira Blob uma vez e fica (voltar slides não decodifica de novo).
async function midia(id) {
    if (URLS[id]) return URLS[id];
    const el = document.getElementById(id); if (!el) return '';
    return (URLS[id] = new Promise(res => setTimeout(() => {
        const tipo = el.dataset.tipo, b64 = el.textContent, partes = [], N = 4 * 1024 * 1024;   // múltiplo de 4
        for (let k = 0; k < b64.length; k += N) {
            const s = atob(b64.slice(k, k + N)), u = new Uint8Array(s.length);
            for (let j = 0; j < s.length; j++) u[j] = s.charCodeAt(j);
            partes.push(u);
        }
        el.textContent = '';
        res(URL.createObjectURL(new Blob(partes, { type: tipo })));
    }, 0)));
}
async function prepararMidias(raiz) {
    const ps = [];
    raiz.querySelectorAll('[data-m]').forEach(el => ps.push(midia(el.dataset.m).then(u => {
        if (el.tagName === 'VIDEO') { el.src = u; el.preload = 'auto'; } else el.src = u;
    })));
    await Promise.race([Promise.all(ps), new Promise(r => setTimeout(r, 4000))]);
    await Promise.all([...raiz.querySelectorAll('img')].map(im => im.decode ? im.decode().catch(() => {}) : null));
}
// adianta as mídias do próximo slide
// (com o navegador folgado: decodificar um vídeo grande no meio de uma transição engasgaria)
function adiantar(i) { const s = P.lista[i]; if (!s) return; (window.requestIdleCallback || (f => setTimeout(f, 700)))(() => (s.m || []).forEach(id => midia(id)), { timeout: 2500 }); }

// ── ocultos: começa como no editor; o que mudar aqui fica guardado neste aparelho ──
const CH = 'sdk-ocultos:' + D.chave;
function lerOcultos() {
    let salvo = null; try { salvo = JSON.parse(localStorage.getItem(CH) || 'null'); } catch (e) { /* sem armazenamento */ }
    P.oc = new Set(salvo || D.slides.filter(s => s.oculto).map(s => s.id));
}
function gravarOcultos() { try { localStorage.setItem(CH, JSON.stringify([...P.oc])); } catch (e) { /* sem armazenamento */ } }
function refazerLista() {
    const atual = P.lista[P.i];
    P.lista = D.slides.filter(s => !P.oc.has(s.id));
    const k = atual ? P.lista.indexOf(atual) : -1;
    if (k >= 0) P.i = k; else P.i = Math.min(P.i, Math.max(0, P.lista.length - 1));
}

// ── desenho e escala ──
function escala() {
    const k = Math.min(innerWidth / W, innerHeight / H), pal = $('palco');
    pal.style.width = W * k + 'px'; pal.style.height = H * k + 'px'; pal.dataset.k = k;
    pal.querySelectorAll('.sd-slide').forEach(s => { s.style.transform = `scale(${k})`; });
}
function montar(s) {
    const box = document.createElement('div'); box.innerHTML = s.html;
    const el = box.firstElementChild;
    el.querySelectorAll('video').forEach(v => {
        const c = (s.videos || {})[v.closest('[data-id]').dataset.id] || {};
        v.playsInline = true; v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
        v.loop = !!c.loop; v.muted = !!c.mudo; v.preload = 'auto';
        if (v.dataset.p) v.poster = v.dataset.p;
        if (!c.auto) v.controls = true;
    });
    return el;
}

// ── animações e transições (as mesmas da apresentação do editor: slider-show.js) ──
const ANIM_DE = { esmaecer: 'opacity:0', subir: 'opacity:0;transform:translateY(80px)', descer: 'opacity:0;transform:translateY(-80px)',
    esquerda: 'opacity:0;transform:translateX(-160px)', direita: 'opacity:0;transform:translateX(160px)', zoom: 'opacity:0;transform:scale(.6)', girar: 'opacity:0;transform:rotate(-25deg) scale(.7)',
    pular: 'opacity:0;transform:scale(.3)', crescer: 'clip-path:inset(100% 0 0 0)', revelar: 'clip-path:inset(0 100% 0 0)' };
const ANIM_CURVA = { pular: 'cubic-bezier(.34,1.7,.5,1)', crescer: 'cubic-bezier(.25,.8,.25,1)', revelar: 'cubic-bezier(.45,0,.2,1)' };
function animDe(a, base) {
    const de = { opacity: a.opac != null && a.opac < 1 ? a.opac : 1, transform: base || 'none' };
    for (const d of (ANIM_DE[a.tipo] || 'opacity:0').split(';')) { const [k, v] = d.split(':'); if (k === 'transform') de.transform = (base + ' ' + v).trim(); else if (k === 'clip-path') de.clipPath = v; else de[k] = +v; }
    return de;
}
function transQuadros(tipo, sinal, k) {
    const S = `scale(${k})`;
    return { esmaecer: [[{ opacity: 0 }, { opacity: 1 }]], deslizar: [[{ transform: `translateX(${sinal * 100}%) ${S}` }, { transform: `translateX(0) ${S}` }]],
        empurrar: [[{ transform: `translateX(${sinal * 100}%) ${S}` }, { transform: `translateX(0) ${S}` }], [{ transform: `translateX(0) ${S}` }, { transform: `translateX(${-sinal * 100}%) ${S}` }]],
        subir: [[{ transform: `translateY(${sinal * 100}%) ${S}` }, { transform: `translateY(0) ${S}` }]],
        zoom: [[{ opacity: 0, transform: `scale(${k * 1.12})` }, { opacity: 1, transform: S }]],
        cobrir: [[{ clipPath: sinal > 0 ? 'inset(0 0 0 100%)' : 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0 0 0)' }]],
        revelar: [[{ clipPath: 'circle(0% at 50% 50%)' }, { clipPath: 'circle(75% at 50% 50%)' }]],
        preto: [[{ opacity: 0, offset: 0 }, { opacity: 0, offset: 0.5 }, { opacity: 1, offset: 1 }], [{ opacity: 1 }, { opacity: 0, offset: 0.5 }, { opacity: 0 }]] }[tipo];
}
function esconder(e, a) {
    e.style.transition = 'none';
    const de = animDe(a, e.dataset.base);
    e.style.opacity = de.opacity; e.style.transform = de.transform === 'none' ? '' : de.transform; e.style.clipPath = de.clipPath || '';
}
function revelar(e, a, ja) {
    void e.offsetWidth;
    const d = a.dur || 0.6, curva = ANIM_CURVA[a.tipo] || 'cubic-bezier(.2,.8,.2,1)';
    e.style.transition = ja ? 'none' : `opacity ${d}s ease, transform ${d}s ${curva}, clip-path ${d}s ${curva}`;
    e.style.opacity = a.opac != null && a.opac < 1 ? a.opac : '1'; e.style.transform = e.dataset.base || '';
    if (e.style.clipPath) { e.style.clipPath = 'inset(0 0 0 0)'; clearTimeout(e._tc); e._tc = setTimeout(() => { e.style.clipPath = ''; }, ja ? 0 : d * 1000 + 60); }
    const v = e.querySelector('video'); if (v && !v.controls) tocar(v);
}
function tocar(v) {
    const p = v.play(); if (!p) return;
    p.catch(() => { if (!v.muted) { v.muted = true; v.play().catch(() => {}); $('som').hidden = false; } });
}
function limpar(x) { x.querySelectorAll('video').forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); }); x.remove(); }

async function ir(i, direcao = 1, passo = 0) {
    const s = P.lista[i]; if (!s || P.ocupado) return;
    P.ocupado = true;
    try {
        const pal = $('palco'), velho = pal.querySelector('.sd-slide:last-child');
        const novo = montar(s);
        await prepararMidias(novo);
        P.i = i; P.passo = 0; P.fim = false; $('tela').hidden = true;
        P.passos = (s.anim || []).filter(a => a.clique);
        for (const a of s.anim || []) {
            const e = novo.querySelector(`[data-id="${a.id}"]`); if (!e) continue;
            e.dataset.base = e.style.transform || '';
            esconder(e, a);
            if (!a.clique) setTimeout(() => revelar(e, a), 60 + (+a.atraso || 0) * 1000);
        }
        pal.appendChild(novo); escala();
        const tr = direcao === null ? null : (direcao > 0 ? s.transicao : (P.lista[i + 1] || {}).transicao);
        const tipo = tr && tr.tipo && tr.tipo !== 'nenhuma' ? tr.tipo : null, dur = (tr && +tr.dur) || 0.5;
        const ani = velho && tipo && transQuadros(tipo, direcao > 0 ? 1 : -1, +pal.dataset.k || 1);
        if (ani) {
            if (tipo === 'preto') pal.style.background = '#000';
            novo.animate(ani[0], { duration: dur * 1000, easing: 'cubic-bezier(.4,0,.2,1)' });
            if (ani[1]) velho.animate(ani[1], { duration: dur * 1000, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
            setTimeout(() => { pal.querySelectorAll('.sd-slide').forEach(x => { if (x !== novo) limpar(x); }); }, dur * 1000 + 30);
        } else pal.querySelectorAll('.sd-slide').forEach(x => { if (x !== novo) limpar(x); });
        novo.querySelectorAll('video').forEach(v => {
            const c = (s.videos || {})[v.closest('[data-id]').dataset.id] || {};
            try { v.currentTime = +c.ini || 0; } catch (e) { /* ainda sem dados */ }
            if (c.auto && parseFloat(v.closest('[data-id]').style.opacity || '1') > 0) tocar(v);   // com animação, toca ao aparecer
        });
        if (passo === 'fim') while (P.passo < P.passos.length) passoSeguinte(true);
        adiantar(i + 1);
        atualizar();
    } finally { P.ocupado = false; }
}
function passoSeguinte(ja = false) {
    const a = P.passos[P.passo]; if (!a) return false;
    const e = $('palco').querySelector(`.sd-slide:last-child [data-id="${a.id}"]`);
    if (e) revelar(e, a, ja);
    P.passo++; atualizar(); return true;
}
function avancar() {
    if (!$('tela').hidden && !P.fim) { $('tela').hidden = true; return; }
    if (P.passo < P.passos.length) { passoSeguinte(); return; }
    if (P.i + 1 < P.lista.length) ir(P.i + 1, 1);
    else if (!P.fim) { P.fim = true; tela('#000', 'Fim da apresentação'); }
}
function voltar() {
    if (!$('tela').hidden) { $('tela').hidden = true; P.fim = false; return; }
    if (P.i > 0) ir(P.i - 1, -1, 'fim');
}
function tela(cor, msg = '') {
    const t = $('tela');
    if (!cor) { t.hidden = true; return; }
    t.hidden = false; t.style.background = cor; t.textContent = msg; t.style.color = cor === '#fff' ? '#000' : '#777';
}

// ── interface ──
function atualizar() {
    const n = P.lista.length;
    $('cont').innerHTML = `<b>${n ? P.i + 1 : 0}</b> / ${n}`;
    $('topo').firstElementChild.style.transform = `scaleX(${n ? (P.i + 1) / n : 0})`;
    $('b-ant').disabled = P.i === 0 && P.passo === 0;
    notas();
}
function notas() {
    const box = $('notas'); if (box.hidden) return;
    const s = P.lista[P.i], prox = P.lista[P.i + 1];
    $('n-txt').textContent = (s && s.notas) || '(sem notas neste slide)';
    $('n-prox').style.backgroundImage = prox ? `url(${prox.mini})` : 'none';
    $('n-prox').textContent = prox ? '' : '';
    relogio();
}
function relogio() {
    if (!P.ini) return;
    const t = Math.floor((Date.now() - P.ini) / 1000);
    $('n-tempo').textContent = `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
    $('n-hora').textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}
setInterval(() => { if (!$('notas').hidden) relogio(); }, 1000);

function aviso(t) { const a = $('aviso'); a.textContent = t; a.classList.add('on'); clearTimeout(a._t); a._t = setTimeout(() => a.classList.remove('on'), 1600); }

function grade(abrir = $('grade').hidden) {
    $('grade').hidden = !abrir;
    $('b-grade').classList.toggle('on', abrir);
    if (!abrir) return;
    const atual = P.lista[P.i];
    $('g-lista').innerHTML = D.slides.map((s, k) => `<div class="it${P.oc.has(s.id) ? ' oculto' : ''}${s === atual ? ' atual' : ''}" data-k="${k}">
        <div class="mini" style="background-image:url(${s.mini})"><span class="tag">Oculto</span>
          <button class="olho" data-olho="${k}" title="${P.oc.has(s.id) ? 'Mostrar' : 'Ocultar'} este slide">${P.oc.has(s.id) ? ICONE_OCULTO : ICONE_OLHO}</button></div>
        <div class="rot"><b>${k + 1}</b><span>${esc(s.titulo || '')}</span></div></div>`).join('');
    const el = $('g-lista').querySelector('.atual'); if (el) el.scrollIntoView({ block: 'center' });
}
const ICONE_OLHO = '<svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ICONE_OCULTO = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.2 6.2C3.6 8 2 12 2 12s3.5 7 10 7c1.7 0 3.2-.4 4.5-1.1"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('g-lista').addEventListener('click', e => {
    const o = e.target.closest('[data-olho]');
    if (o) {
        e.stopPropagation();
        const s = D.slides[+o.dataset.olho];
        if (P.oc.has(s.id)) P.oc.delete(s.id);
        else { if (D.slides.filter(x => !P.oc.has(x.id)).length <= 1) return aviso('Pelo menos um slide precisa ficar visível'); P.oc.add(s.id); }
        gravarOcultos();
        const eraAtual = P.lista[P.i] === s;
        refazerLista(); grade(true); atualizar(); info();
        if (eraAtual && P.oc.has(s.id) && $('inicio').hidden) ir(P.i, null);   // apresentando: o slide atual sumiu, mostra o seguinte
        return;
    }
    const it = e.target.closest('.it'); if (!it) return;
    const s = D.slides[+it.dataset.k];
    if (P.oc.has(s.id)) { P.oc.delete(s.id); gravarOcultos(); refazerLista(); }
    grade(false);
    comecar(P.lista.indexOf(s));
});

async function cheia() {
    const d = document, el = d.documentElement;
    try {
        if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
        await (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        if (screen.orientation && screen.orientation.lock && toque) screen.orientation.lock('landscape').catch(() => {});
    } catch (e) { /* aparelho sem tela cheia (iPhone): a página já ocupa a tela */ }
}
const temCheia = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
if (!temCheia) $('b-cheia').style.display = 'none';
document.addEventListener('fullscreenchange', () => $('b-cheia').classList.toggle('on', !!document.fullscreenElement));

async function manterTela() { try { if ('wakeLock' in navigator) P.wake = await navigator.wakeLock.request('screen'); } catch (e) { /* sem trava de tela */ } }
document.addEventListener('visibilitychange', () => { if (!document.hidden && P.ini) manterTela(); });

function comecar(i = 0) {
    $('inicio').hidden = true;
    if (!P.ini) { P.ini = Date.now(); manterTela(); }
    ir(Math.max(0, i), null);
    acordar();
}

// controles somem parados; voltam ao mexer o mouse ou tocar
function acordar() { const pl = $('pl'); pl.classList.remove('ocioso'); clearTimeout(P.to); P.to = setTimeout(() => { if ($('grade').hidden && $('inicio').hidden) pl.classList.add('ocioso'); }, toque ? 3200 : 2200); }
addEventListener('mousemove', acordar);

// ── teclado (inclusive o passador de slides: PageDown/PageUp, "." tela preta) ──
addEventListener('keydown', e => {
    const k = e.key;
    if (!$('inicio').hidden) { if ([' ', 'Enter', 'ArrowRight', 'PageDown'].includes(k)) { e.preventDefault(); comecar(0); } return; }
    if (!$('grade').hidden) { if (k === 'Escape' || k === 'g' || k === 'G') { e.preventDefault(); grade(false); } return; }
    const feito = () => e.preventDefault();
    if (/^[0-9]$/.test(k)) { feito(); P.num += k; aviso('Ir ao slide ' + P.num); return; }
    if (k === 'Enter' && P.num) { feito(); const n = Math.max(1, Math.min(P.lista.length, +P.num)) - 1; P.num = ''; ir(n, n > P.i ? 1 : -1); return; }
    if (['ArrowRight', 'ArrowDown', ' ', 'PageDown', 'Enter'].includes(k)) { feito(); avancar(); return; }
    if (['ArrowLeft', 'ArrowUp', 'PageUp', 'Backspace'].includes(k)) { feito(); voltar(); return; }
    if (k === 'Home') { feito(); ir(0, -1); return; }
    if (k === 'End') { feito(); ir(P.lista.length - 1, 1, 'fim'); return; }
    if (k === 'b' || k === 'B' || k === '.') { feito(); tela($('tela').hidden ? '#000' : null); return; }
    if (k === 'w' || k === 'W' || k === ',') { feito(); tela($('tela').hidden ? '#fff' : null); return; }
    if (k === 'f' || k === 'F') { feito(); cheia(); return; }
    if (k === 'g' || k === 'G') { feito(); grade(); return; }
    if (k === 'n' || k === 'N') { feito(); alternarNotas(); return; }
    if (k === 'Escape') { if (!$('notas').hidden) { feito(); alternarNotas(); } }
});
function alternarNotas() { const n = $('notas'); n.hidden = !n.hidden; $('b-notas').classList.toggle('on', !n.hidden); notas(); }

// ── toque e clique: deslizar troca de slide; toque à direita avança, à esquerda volta ──
let t0 = null;
$('palco').parentElement.addEventListener('pointerdown', e => {
    if (e.target.closest('#barra,#grade,#notas,#inicio,#som,video[controls]')) return;
    t0 = { x: e.clientX, y: e.clientY, t: Date.now() };
});
addEventListener('pointerup', e => {
    if (!t0) return;
    const dx = e.clientX - t0.x, dy = e.clientY - t0.y, rap = Date.now() - t0.t < 600; t0 = null;
    acordar();
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) && rap) { if (dx < 0) avancar(); else voltar(); return; }
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12) { if (e.clientX < innerWidth * 0.33) voltar(); else avancar(); }
});
addEventListener('contextmenu', e => { if (!e.target.closest('video')) { e.preventDefault(); voltar(); } });
addEventListener('resize', escala);
addEventListener('orientationchange', () => setTimeout(escala, 200));

$('b-ant').onclick = e => { e.stopPropagation(); voltar(); acordar(); };
$('b-prox').onclick = e => { e.stopPropagation(); avancar(); acordar(); };
$('b-grade').onclick = e => { e.stopPropagation(); grade(); };
$('g-fechar').onclick = () => grade(false);
$('b-notas').onclick = e => { e.stopPropagation(); alternarNotas(); };
$('b-preto').onclick = e => { e.stopPropagation(); tela($('tela').hidden ? '#000' : null); };
$('b-cheia').onclick = e => { e.stopPropagation(); cheia(); };
$('som').onclick = e => { e.stopPropagation(); $('palco').querySelectorAll('video').forEach(v => { v.muted = false; v.play().catch(() => {}); }); $('som').hidden = true; };
$('i-ir').onclick = () => { cheia(); comecar(0); };
$('i-grade').onclick = () => { grade(true); };

// ── abertura ──
lerOcultos(); refazerLista();
document.title = D.nome || document.title;
$('i-titulo').textContent = D.nome || 'Apresentação';
function info() {
    const n = P.lista.length, oc = D.slides.length - n;
    $('i-info').textContent = `${n} slide${n === 1 ? '' : 's'}${oc ? ` · ${oc} oculto${oc === 1 ? '' : 's'}` : ''}`;
}
info();
$('i-fundo').style.backgroundImage = `url(${(P.lista[0] || D.slides[0]).mini})`;
// capa viva: o 1º slide montado de verdade (o vídeo fica na capa dele, parado)
async function capa() {
    const box = $('i-capa'), s = P.lista[0] || D.slides[0];
    box.style.backgroundImage = `url(${s.mini})`; box.style.backgroundSize = 'cover';
    const el = montar(s);
    el.querySelectorAll('video').forEach(v => { const im = document.createElement('img'); im.src = v.dataset.p || ''; im.style.cssText = v.style.cssText; v.replaceWith(im); });
    await prepararMidias(el);
    box.innerHTML = ''; box.appendChild(el);
    const ajustar = () => { el.style.transform = `scale(${box.clientWidth / W})`; };
    ajustar(); addEventListener('resize', ajustar);
}
capa();
if (toque) $('i-dica').textContent = 'Deslize ou toque nas laterais para passar os slides';
escala(); atualizar(); adiantar(0);
window.SLIDER_PLAYER = { estado: () => ({ i: P.i, passo: P.passo, total: P.lista.length, ocultos: [...P.oc], inicio: !$('inicio').hidden }), ir, avancar, voltar, comecar, grade };
</script>
</body>
</html>
