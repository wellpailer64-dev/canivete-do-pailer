name: Build e Release

# A cada push na main: builda o .exe no Windows e publica uma Release.
# O app instalado detecta a Release nova e oferece "Atualizar agora".
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Instructions/**"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Definir versão (major.minor do version.txt + número do build)
        id: ver
        shell: pwsh
        run: |
          $base = (Get-Content version.txt -TotalCount 1).Trim()
          $p = $base.Split('.')
          $v = "$($p[0]).$($p[1]).${{ github.run_number }}"
          Set-Content -Path version.txt -Value $v -NoNewline -Encoding ascii
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Versão: $v"

      - name: Credencial do Google Drive (secret do repositório)
        shell: pwsh
        env:
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
        run: |
          if (-not $env:GDRIVE_CLIENT_SECRET) { Write-Error "Configure o secret GDRIVE_CLIENT_SECRET no repositório."; exit 1 }
          Set-Content -Path Functions/_credenciais.py -Value "CLIENT_SECRET = `"$($env:GDRIVE_CLIENT_SECRET.Trim())`"" -Encoding utf8

      - name: Build (PyInstaller)
        shell: cmd
        run: build.bat --ci

      - name: Compactar
        shell: pwsh
        run: 7z a -tzip -mx=5 CaniveteDoPailer-win64.zip .\dist\CaniveteDoPailer

      - name: Publicar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: KANIVETE v${{ steps.ver.outputs.version }}
          body: |
            ${{ github.event.head_commit.message }}

            **Instalação nova:** baixe `CaniveteDoPailer-win64.zip`, extraia e rode `CaniveteDoPailer.exe`.
            **Já tem instalado:** o app avisa sozinho e atualiza com um clique.
          files: CaniveteDoPailer-win64.zip
          make_latest: true
