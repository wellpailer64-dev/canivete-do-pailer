<!doctype html>
<html><head><meta charset="utf-8">
<!-- Receita 4: transição com logo gigante e desfocado cruzando a tela (ref. reel TEVEO, 19 s). 0,7 s; o pico (cobertura total) cai no
     corte entre dois clipes. Trocar #logo por o PNG da marca (branco/transparente), #cor pela cor da marca. Use como camada acima dos dois
     clipes, com o corte no tempo 0,35 s. Dica: bata o pico com um whoosh (efeitos-sonoros-video.md). -->
<meta name="kv" content="w=1080;h=1920;fps=30;dur=0.7">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:transparent}
.abs{position:absolute}
#cor{left:0;top:0;width:1080px;height:1920px;background:#2b2178;animation:cob .7s ease-in-out both}
@keyframes cob{0%{opacity:0}35%{opacity:.92}55%{opacity:.92}100%{opacity:0}}
#logo{left:-300px;top:560px;width:1680px;height:800px;object-fit:contain;
      animation:cruza .7s cubic-bezier(0.65,0,0.35,1) both}
@keyframes cruza{0%{transform:translateX(900px) rotate(-14deg) scale(.8);filter:blur(34px);opacity:0}
                 35%{opacity:1}
                 50%{transform:translateX(0) rotate(-6deg) scale(1.25);filter:blur(10px);opacity:1}
                 100%{transform:translateX(-1000px) rotate(4deg) scale(1.5);filter:blur(34px);opacity:0}}
</style></head>
<body>
  <div id="cor" class="abs"></div>
  <img id="logo" class="abs" src="../../../../frontend/identidade/kani.webp">
</body></html>
