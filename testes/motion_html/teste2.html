<!doctype html>
<html><head><meta charset="utf-8">
<meta name="kv" content="w=1080;h=1920;fps=30;dur=5">
<style>
  html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#F4EFE6;font-family:Georgia, serif}
  .abs{position:absolute}
  /* grupo que gira levando os filhos (órbita) */
  #orbita{left:340px;top:200px;width:400px;height:400px;animation:gira 4s linear both}
  @keyframes gira{to{transform:rotate(180deg)}}
  .lua{position:absolute;width:80px;height:80px;border-radius:50%;background:#F47A1F}
  #lua1{left:0;top:160px} #lua2{left:320px;top:160px;background:#141414}
  #centro{left:470px;top:330px;width:140px;height:140px;border-radius:32px;border:8px solid #141414;background:#FDE3CF;box-sizing:border-box;
    animation:pop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s both}
  @keyframes pop{from{transform:scale(0.2) rotate(-30deg);opacity:0}to{transform:none;opacity:1}}
  /* letra por letra */
  #palavra{left:0;top:760px;width:1080px;text-align:center;font-size:150px;font-weight:700;color:#141414;font-style:italic}
  #palavra span{display:inline-block;animation:letra 0.45s cubic-bezier(0.16,1,0.3,1) both}
  @keyframes letra{from{transform:translateY(80px);opacity:0}to{transform:none;opacity:1}}
  /* várias linhas centradas */
  #frase{left:140px;top:1000px;width:800px;text-align:center;font-size:58px;line-height:1.3;color:#3a3a3a;font-family:Arial, sans-serif;
    animation:sobe 0.8s ease-out 1.6s both}
  @keyframes sobe{from{opacity:0;transform:translateY(40px) scale(0.96)}to{opacity:1;transform:none}}
  #foto{left:390px;top:1350px;width:300px;height:300px;animation:foto 0.7s cubic-bezier(0.16,1,0.3,1) 2.4s both}
  @keyframes foto{from{transform:translateX(600px) rotate(25deg)}to{transform:none}}
  #selo{left:120px;top:1700px;width:840px;height:110px;border-radius:55px;background:#141414;color:#F4EFE6;font:700 52px Arial, sans-serif;
    text-align:center;line-height:110px}
</style></head>
<body>
  <div id="orbita" class="abs"><div id="lua1" class="lua"></div><div id="lua2" class="lua"></div></div>
  <div id="centro" class="abs"></div>
  <div id="palavra" class="abs"></div>
  <div id="frase" class="abs">Grupos, letras, imagens e textos em várias linhas, tudo nativo no editor</div>
  <img id="foto" class="abs" src="../../frontend/identidade/kani.webp">
  <div id="selo" class="abs">feito por script</div>
  <script>
    const p = document.getElementById('palavra');
    [...'Kanivete'].forEach((l, i) => { const s = document.createElement('span'); s.textContent = l; s.style.animationDelay = (0.8 + i * 0.06) + 's'; p.append(s); });
    document.getElementById('selo').animate([{ transform: 'translateY(200px)', opacity: 0 }, { transform: 'none', opacity: 1 }],
      { duration: 600, delay: 3200, easing: 'cubic-bezier(0.22,1,0.36,1)', fill: 'both' });
  </script>
</body></html>
